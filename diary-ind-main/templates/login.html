<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jurnal programmer</title>
    <link rel="stylesheet" href="../static/css/style.css">
</head>
<body>
    <header class="header">
        <img src="../static/img/logo.svg" alt="logo" width="30" height="30">
        <ul class="main-list">

        </ul>
    </header>
    <main class="main-login">
        {% block content %}
        <form action="{{ url_for('login') }}" method="POST" class="login">
            <p class="error">{{error}}</p>

            <!-- Tugas #2. Membuat kolom login -->
            
            <div class="form__group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required>
            </div>
            <div class="form__group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required>
            </div>

            <!--  -->
                <button class="form__button">Masuk</button>
                <a href="/reg" class="form__button reg__link">Daftar</a>
        </form>
        {% endblock %}
    </main>
</body>
</html>
