<!doctype html>
<html lang="en">
<head>
  <!--These are important for ensuring that the page displays correctly on different devices and browsers. -->
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  <link rel="stylesheet" href="../static/css/style.css">
  <link rel="icon" type="image/x-icon" href="../static/img/html2.png">
  <title>Journal Programmer</title>
</head>
<body>
  <header class="header">
    <img src="../static/img/logo.svg" alt="logo" width="30" height="30">
    <ul class="main-list">
        <li class="list__item">
            <!-- <img src="../static/img/login.svg" alt="login" width="20" height="20"> -->
            <a href="{{ url_for('logout') }}" class="nav__link">
                        <img src="{{ url_for('static', filename='img/login.svg') }}" 
                             alt="Logout" 
                             width="20" 
                             height="20">
                        <span>Logout</span>
                    </a>
        </li>
    </ul>
  </header>
  <main>
    {% block content %}
    <h1 class="main__title">My Notes</h1>
    <ul class="cards-list">
      {% for el in cards %}
        <li class="card">
          <a class="card__link" href="/card/{{el.id}}">
            <img class="card__img" src="../static/img/post_icon.png" width="250" height="250" alt="post_icon">
            <div class="card__text">
              <h2 class="card__title">{{el.title}}</h2>
              <p class="card__subtitle">{{el.subtitle}}</p>
            </div>
          </a>
          <div class="card-actions">
            <a href="{{ url_for('delete', id=el.id) }}" class="hapus-button" onclick="return confirm('Are you sure?')">Delete</a>
          </div>
        </li>
      {% endfor %}
      <li class="card card--creat">
        <a class="creat__link" href="{{url_for('create')}}" title="Create new entry">Create new entry</a>
      </li>
    </ul>
    {% endblock %}
  </main>
  <footer class="site-footer">
    <p>&copy; {{ now.year }} Elvan Vensiando. All rights reserved.</p>
  </footer>
</body>
</html>
