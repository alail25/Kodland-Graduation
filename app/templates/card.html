<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Journal entry details">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='img/html2.png') }}">
    <title>{{ card.title }} - Journal Programmer</title>
</head>
<body>
    <header class="header">
        <nav class="nav">
            <a href="{{ url_for('index') }}" class="nav__logo">
                <img src="{{ url_for('static', filename='img/logo.svg') }}" 
                     alt="Journal Programmer Logo" 
                     width="30" 
                     height="30">
            </a>
            <ul class="main-list">
                <li class="list__item">
                    <a href="{{ url_for('logout') }}" class="nav__link">
                        <img src="{{ url_for('static', filename='img/login.svg') }}" 
                             alt="Logout" 
                             width="20" 
                             height="20">
                        <span>Logout</span>
                    </a>
                </li>
            </ul>
        </nav>
    </header>

    <main class="main">
        <article class="main__block">
            <header>
                <h1 class="main__title">{{ card.title }}</h1>
                <h2 class="main__subtitle">{{ card.subtitle }}</h2>
            </header>

            <div class="main__text">
                {{ card.text }}
            </div>

            <footer class="card-actions">
                <a href="{{ url_for('edit', id=card.id) }}" class="main__link">Edit Entry</a>
                <a href="{{ url_for('index') }}" class="main__link">Back to Entries</a>
                <br>
                <a href="{{ url_for('delete', id=card.id) }}" 
                   class="hapus-button" 
                   onclick="return confirm('Are you sure you want to delete this entry?')">
                    Delete Entry
                </a>
            </footer>
        </article>
    </main>
    <footer class="site-footer">
        <p>&copy; {{ now.year }} Elvan Vensiando. All rights reserved.</p>
    </footer>
</body>
</html>
